<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="index-body">
    
    <!-- FLORES MORADAS HECHAS PURAMENTE CON CÓDIGO HTML/CSS (Cero imágenes) -->
    <!-- Ramo Superior Izquierdo -->
    <div class="css-flower-cluster top-left-cluster">
        <div class="leaf" style="top:50px; left:80px; transform: rotate(60deg);"></div>
        <div class="leaf" style="top:90px; left:30px; transform: rotate(-10deg);"></div>
        
        <div class="purple-flower" style="top:40px; left:40px;">
            <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="core"></div>
        </div>
        <div class="purple-flower" style="top:85px; left:75px; transform: scale(0.8) rotate(25deg);">
            <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="core"></div>
        </div>
        <div class="purple-flower" style="top:10px; left:95px; transform: scale(0.65) rotate(-15deg);">
            <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="core"></div>
        </div>
    </div>

    <!-- Ramo Inferior Derecho -->
    <div class="css-flower-cluster bottom-right-cluster">
        <div class="leaf" style="top:10px; left:20px; transform: rotate(-120deg);"></div>
        <div class="leaf" style="top:50px; left:-20px; transform: rotate(150deg);"></div>
        
        <div class="purple-flower" style="top:20px; left:20px;">
            <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="core"></div>
        </div>
        <div class="purple-flower" style="top:-25px; left:-15px; transform: scale(0.85) rotate(-35deg);">
            <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="core"></div>
        </div>
        <div class="purple-flower" style="top:65px; left:-5px; transform: scale(0.7) rotate(45deg);">
            <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="core"></div>
        </div>
    </div>

    <!-- Corazones dorados flotantes -->
    <div class="particles" id="particles"></div>
    
    <div class="scene">
        <!-- Contenedor del sobre -->
        <div class="envelope-wrapper">
            <div class="flap"></div>
            <div class="wax-seal">
                <span>R&A</span>
            </div>
            <h1 class="recipient">Una vida contigo...</h1>
        </div>
        
        <a href="carta.html" class="btn-abrir">Abrir nuestra historia</a>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
